name: FriendZones - Cloudflare staging

on:
  push:
    branches:
      - migration/cloudflare-workers-friendzone-20261009
  pull_request:
    paths:
      - "cloudflare/**"
      - "scripts/build-cloudflare-static.mjs"
      - ".github/workflows/cloudflare-staging.yml"
      - "api_src/**"
  workflow_dispatch:
    inputs:
      upload_unrouted:
        description: "Upload private UNROUTED Worker to Cloudflare (not a public launch)"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend production dependencies
        run: npm install --omit=dev --no-package-lock --no-audit --no-fund

      - name: Validate existing API code
        run: npm run lint

      - name: Build public-only static assets
        run: node scripts/build-cloudflare-static.mjs

      - name: Ensure private repository files are NOT served
        run: |
          test -f dist/cloudflare-public/index.html
          test -f dist/cloudflare-public/login/index.html
          test -f dist/cloudflare-public/nhan-vien/index.html
          test -f dist/cloudflare-public/du-an/venus-mui-ne-resort/index.html
          test ! -e dist/cloudflare-public/api_src
          test ! -e dist/cloudflare-public/supabase
          test ! -e dist/cloudflare-public/.github
          test ! -e dist/cloudflare-public/README.md
          node --check cloudflare/worker.mjs

      - name: Cloudflare Worker bundle dry-run (no credentials)
        run: npx --yes wrangler@4.149.0 deploy --dry-run --config cloudflare/wrangler.jsonc --outdir .wrangler-build

      - name: Smoke test local Worker responses
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 dev --local --ip 127.0.0.1 --port 8787 --config cloudflare/wrangler.jsonc > /tmp/frz-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            status=$(curl --max-time 2 -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/ || true)
            if [ "$status" = "200" ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then cat /tmp/frz-worker.log; exit 1; fi
          for endpoint in / /login/ /nhan-vien/ /du-an/venus-mui-ne-resort/; do
            status=$(curl --max-time 10 -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8787$endpoint")
            echo "$endpoint -> $status"
            test "$status" = "200"
          done
          for endpoint in /api/health /nhan-vien/config.js; do
            status=$(curl --max-time 10 -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8787$endpoint")
            echo "$endpoint without secrets -> $status"
            test "$status" = "503"
          done
          status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/api_src/supabase.js)
          test "$status" = "404"

      - name: Require Cloudflare secrets for optional unrouted upload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_unrouted }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Upload staging Worker WITHOUT PUBLIC ROUTES
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_unrouted }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config cloudflare/wrangler.jsonc

# Scheduled reporting MUST remain disabled until Vercel cron is removed during cutover.
# DNS, public routes and workers.dev are not enabled by this workflow.
